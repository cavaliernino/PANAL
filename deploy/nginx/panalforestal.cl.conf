# /etc/nginx/sites-available/panalforestal.cl
#
# PANAL en fuego. Sitio estático: el repo vive en /var/www/panal.ninobozzi.cl
# y solo se sirve web/. El cron del usuario nino reescribe
# web/data/national.json cada 10 minutos.
#
# Cinco nombres, un sitio:
#   panalforestal.cl        el sitio
#   www.panalforestal.cl    301 al de arriba
#   panalstaysafe.cl        301 al de arriba (dominio extra, desde 8-oct-2026)
#   www.panalstaysafe.cl    301 al de arriba
#   panal.ninobozzi.cl      la dirección hasta el 6-oct-2026: 301 al de
#                           arriba, salvo /sw.js (ver su server más abajo)
#
# El clon se quedó en la ruta del nombre anterior: moverlo obliga a rehacer
# el venv y el cron, y la ruta no la ve nadie.
#
# Los certificados se emiten por webroot (/var/www/html), igual que el resto
# de los vhosts de este servidor. Ver deploy/README.md.

# El snapshot en vivo cambia cada 10 minutos: nunca de caché. La página
# muestra la edad del dato, y una copia vieja servida por un proxy mentiría
# sobre eso.
#
# Va por map y no con un add_header dentro de `location = /data/national.json`
# porque en nginx un add_header en una location anula TODOS los del server:
# el JSON se quedaba sin las cabeceras de seguridad. Valor vacío = no se envía.
map $uri $panal_cache_control {
    /data/national.json  "no-cache";
    default              "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Una conexión por visitante en vez de seis: importa con tráfico alto y,
    # sobre todo, con CGNAT móvil, donde cientos comparten una IP.
    http2 on;
    server_name panalforestal.cl;

    root /var/www/panal.ninobozzi.cl/web;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/panalforestal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panalforestal.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/panal.access.log;
    error_log  /var/log/nginx/panal.error.log warn;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Sitio de solo lectura: nadie tiene por qué mandar cuerpo.
    client_max_body_size 1k;

    # Generoso a propósito: con CGNAT una IP puede ser un barrio entero. No va
    # limit_req por IP por la misma razón; nginx sirve estático de sobra.
    limit_conn addr 100;

    add_header Cache-Control $panal_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    # Sin includeSubDomains: un subdominio futuro sin TLS quedaría
    # inalcanzable por un año en todo navegador que haya pasado por acá.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # brujula.html usa cámara, ubicación y orientación; wui.html, ubicación.
    # Se permiten al propio origen, nunca a terceros.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    # REPORT-ONLY: la política se evalúa y se reporta en la consola del
    # navegador, pero no bloquea nada. Pasarla a Content-Security-Policy solo
    # después de recorrer las cuatro páginas sin violaciones en consola.
    # - 'unsafe-inline' en script-src: las páginas tienen <script> en línea.
    # - connect-src incluye los CDN porque sw.js los descarga para la caché
    #   offline, y al service worker lo rige la CSP con que se sirvió sw.js.
    # - worker-src blob:: maplibre levanta sus workers desde blobs.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https://basemaps.cartocdn.com https://tiles.basemaps.cartocdn.com https://tiles.openfreemap.org; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://basemaps.cartocdn.com https://tiles.basemaps.cartocdn.com https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location ~ /\.(?!well-known) { deny all; return 404; }

    # El README de web/ es para quien lee el repo, no para el público.
    location = /README.md { return 404; }

    # Analítica: el Umami que ya corre en fuego para humanalegal, 33bit y
    # bozzi (contenedor en 127.0.0.1:3001, panel en umami.humanalegal.cl).
    # Sin cookies. El tracker y su endpoint se sirven desde este origen: sin
    # CORS, la CSP no cambia ('self' cubre los dos) y los bloqueadores no lo
    # reconocen por el host. El tracker arma el endpoint con la carpeta de su
    # propio src: servido en /u.js, manda a /api/send.
    #
    # `location =`, exactas: con una de prefijo, /u.js caería en el try_files
    # de `location /` y daría 404 sin ningún error visible.
    location = /u.js { proxy_pass http://127.0.0.1:3001/script.js; }

    # Una visita = un POST. Sin la IP real, Umami ve a todos llegar desde
    # 127.0.0.1: se pierden país y región, y todos cuentan como una sola
    # persona (la sesión es un hash de IP y navegador). $remote_addr y no
    # $proxy_add_x_forwarded_for: nginx es el borde, así que se pisa lo que
    # mande el cliente y nadie inventa otra IP. El cuerpo es un JSON chico
    # pero con título, URL y referrer: el 1k del server le queda justo.
    location = /api/send {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3001/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        limit_except GET { deny all; }   # GET incluye HEAD
        try_files $uri $uri/ =404;
    }
}

# www: solo redirige. Usa el mismo certificado, que lleva los dos nombres.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.panalforestal.cl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/panalforestal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panalforestal.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/panal.access.log;
    error_log  /var/log/nginx/panal.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://panalforestal.cl$request_uri;
}

# Dominio extra: solo redirige, como www. Redirige en vez de servir el sitio
# porque el service worker, la caché offline y los permisos de cámara y
# ubicación son por origen: dos orígenes con el mismo sitio son dos apps
# distintas en el teléfono, y una de ellas queda vieja. Nadie instaló la app
# con este nombre, así que no necesita el sw.js de retiro de panal.ninobozzi.cl.
# Certificado propio y no un nombre más en el de panalforestal.cl: si este
# dominio dejara de pagarse, su renovación fallida no arrastra a la del sitio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panalstaysafe.cl www.panalstaysafe.cl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/panalstaysafe.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panalstaysafe.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/panal.access.log;
    error_log  /var/log/nginx/panal.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://panalforestal.cl$request_uri;
}

# El nombre anterior. Para enlaces y marcadores basta un 301, pero no para
# quien instaló la app: su service worker (web/sw.js) pide cada página y el
# JSON a este nombre, el 301 lo manda a otro origen, la petición falla por
# CORS y el worker contesta desde su caché. La app quedaría mostrando el
# último dato que tuvo — con su edad, pero para siempre. Y el worker no se
# reemplaza solo, porque el navegador no sigue redirects al buscar un sw.js
# nuevo.
#
# Por eso /sw.js no redirige: entrega deploy/sw-retired.js, que vacía la
# caché, manda la ventana a la misma página en panalforestal.cl y se
# desinstala. Log aparte para saber cuándo ya nadie llega por acá.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panal.ninobozzi.cl;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/panal.ninobozzi.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panal.ninobozzi.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/panal-old.access.log;
    error_log  /var/log/nginx/panal.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /sw.js {
        alias /var/www/panal.ninobozzi.cl/deploy/sw-retired.js;
        # add_header aquí anula los del server: se repiten los que importan.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / { return 301 https://panalforestal.cl$request_uri; }
}

# Por HTTP todos van directo al destino final. ACME sigue respondiendo
# para todos: el certificado de panal.ninobozzi.cl también se renueva,
# porque sin HTTPS no hay sw.js que retire la app vieja.
server {
    listen 80;
    listen [::]:80;
    server_name panalforestal.cl www.panalforestal.cl panal.ninobozzi.cl
                panalstaysafe.cl www.panalstaysafe.cl;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://panalforestal.cl$request_uri; }
}
