# /etc/nginx/sites-available/panal.ninobozzi.cl
#
# PANAL en fuego. Sitio estático: el repo vive en /var/www/panal.ninobozzi.cl
# y solo se sirve web/. El cron del usuario nino reescribe
# web/data/national.json cada 10 minutos.
#
# El certificado se emite por webroot (/var/www/html), igual que el resto de
# los vhosts de este servidor. Ver deploy/README.md.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panal.ninobozzi.cl;

    root /var/www/panal.ninobozzi.cl/web;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/panal.ninobozzi.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panal.ninobozzi.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/panal.access.log;
    error_log  /var/log/nginx/panal.error.log warn;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # El snapshot en vivo cambia cada 10 minutos: nunca de caché. La página
    # muestra la edad del dato, y una copia vieja servida por un proxy
    # mentiría sobre eso.
    location = /data/national.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; return 404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name panal.ninobozzi.cl;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
